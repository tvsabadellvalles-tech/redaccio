name: Rastreo y publicación

on:
  push:
    branches:
      - main
    # Los commits automáticos de datos no deben volver a disparar el rastreo.
    paths-ignore:
      - 'docs/data/**'
  schedule:
    - cron: '3-59/5 * * * *' # cada 5 minutos, evitando el minuto 0 (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Impide que dos rastreos/publicaciones trabajen a la vez.
concurrency:
  group: rastreo
  cancel-in-progress: false
  queue: max

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rastrear fuentes
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: npm run rastreo

      - name: Guardar cambios (solo si hay novedades)
        id: guardar
        shell: bash
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "rastreo-bot"
          git config user.email "rastreo-bot@users.noreply.github.com"

          # Primer intento con los datos ya rastreados.
          cambio_guardado=false
          git add docs/data
          if ! git diff --staged --quiet; then
            git commit -m "Rastreo: actualización de datos"
            cambio_guardado=true
          else
            echo "Sin cambios iniciales."
          fi

          # Si main ha avanzado desde el checkout, no hacemos rebase de JSON:
          # recuperamos la última versión y volvemos a rastrear sobre ella.
          # Así evitamos conflictos y no perdemos novedades de otra ejecución.
          for intento in 1 2 3; do
            git fetch origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "main ha avanzado; se vuelve a rastrear sobre la última versión."
              git reset --hard origin/main
              npm run rastreo
              git add docs/data

              if git diff --staged --quiet; then
                echo "La última versión ya contiene todos los datos; no hay nada que guardar."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              git commit -m "Rastreo: actualización de datos"
              cambio_guardado=true
            fi

            if git push origin HEAD:main; then
              echo "Datos guardados correctamente (intento $intento)."
              echo "changed=$cambio_guardado" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rechazado; se sincronizará y repetirá el rastreo (intento $intento/3)."
            sleep 3
          done

          echo "No se pudieron guardar los datos después de 3 intentos."
          exit 1

      # Una ejecución programada solo vuelve a publicar Pages si hay datos nuevos.
      # Los pushes de cambios de código/configuración siempre publican el sitio.
      - name: Configurar GitHub Pages
        if: github.event_name == 'push' || steps.guardar.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        if: github.event_name == 'push' || steps.guardar.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar en GitHub Pages
        if: github.event_name == 'push' || steps.guardar.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
