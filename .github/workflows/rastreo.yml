name: Rastreo y publicación

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'   # cada 30 min (GitHub puede retrasarlo en horas punta)
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rastrear fuentes
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: npm run rastreo

      - name: Guardar cambios (solo si hay novedades)
        run: |
          git config user.name "rastreo-bot"
          git config user.email "rastreo-bot@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Rastreo: actualización de datos"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
