name: Rastreo y publicación

on:
  push:
    branches:
      - main
    # Los commits automáticos de datos no deben volver a disparar el rastreo.
    paths-ignore:
      - 'docs/data/**'
  schedule:
    - cron: '3-59/5 * * * *' # cada 5 minutos, evitando el minuto 0 (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Impide que dos rastreos/publicaciones trabajen a la vez.
concurrency:
  group: rastreo
  cancel-in-progress: false
  queue: max

jobs:
  rastrear:
    runs-on: windows-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Diagnòstic puntual del WMS oficial quan es canvia el codi (no s'executa en cada rastreig programat).
      - name: Diagnosticar WMS oficial de Trànsit
        if: github.event_name == 'push'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://sctwms.gencat.cat/WMS/mapserv.exe';
          const map = '\\\\localhost\\AGATA\\EstatDelTransit.map';
          async function resposta(params) {
            const url = new URL(base);
            url.searchParams.set('map', map);
            for (const [k, v] of Object.entries(params)) url.searchParams.set(k, String(v));
            const r = await fetch(url, { signal: AbortSignal.timeout(25000), headers: { 'User-Agent': 'TVSabadellValles-Redaccio/1.0', Accept: '*/*' } });
            return { r, body: await r.text() };
          }
          const caps = await resposta({ SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetCapabilities' });
          console.log('[wms-check] capabilities: http=' + caps.r.status + ' type=' + (caps.r.headers.get('content-type') || '') + ' bytes=' + Buffer.byteLength(caps.body));
          const layerMatches = [];
          for (const fragment of caps.body.split('<Layer').slice(1)) {
            const fi = fragment.indexOf('>');
            const ni = fragment.indexOf('<Name>');
            const nf = ni >= 0 ? fragment.indexOf('</Name>', ni) : -1;
            if (fi < 0 || ni < 0 || nf < 0) continue;
            const attrs = fragment.slice(0, fi);
            const name = fragment.slice(ni + 6, nf).trim();
            layerMatches.push(name + ' queryable=' + attrs.includes('queryable="1"'));
          }
          console.log('[wms-check] layers: ' + layerMatches.join(' | '));
          for (const layers of ['TOT', 'SERVEI', 'AFECTACIONS_DE_CIRCULACIO,AFECTACIONS_PER_OBRES,CONS']) {
            const mapa = await resposta({
              SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetMap',
              LAYERS: layers, STYLES: '', SRS: 'EPSG:4326',
              BBOX: '1.7,41.3,2.5,41.8', WIDTH: 1000, HEIGHT: 620,
              FORMAT: 'image/png', TRANSPARENT: 'TRUE'
            });
            console.log('[wms-check] map ' + layers + ': http=' + mapa.r.status + ' type=' + (mapa.r.headers.get('content-type') || '') + ' bytes=' + Buffer.byteLength(mapa.body));
          }
          const bbox = [1.7, 41.3, 2.5, 41.8], width = 1200, height = 1200;
          const punts = [
            ['C58-sud', 2.18, 41.49],
            ['C58-Sabadell', 2.10, 41.54],
            ['C58-Terrassa', 2.01, 41.57],
            ['B30-SantCugat', 2.07, 41.47],
            ['B30-Barbera', 2.13, 41.50],
            ['AP7-Barbera', 2.15, 41.51],
            ['N150-Sabadell', 2.10, 41.55]
          ];
          for (const capa of ['AFECTACIONS_DE_CIRCULACIO', 'AFECTACIONS_PER_OBRES', 'CONS', 'SERVEI']) {
            for (const [nom, lon, lat] of punts) {
              const x = Math.round((lon - bbox[0]) / (bbox[2] - bbox[0]) * width);
              const y = Math.round((bbox[3] - lat) / (bbox[3] - bbox[1]) * height);
              try {
                const q = await resposta({
                  SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetFeatureInfo',
                  LAYERS: capa, QUERY_LAYERS: capa, STYLES: '', SRS: 'EPSG:4326',
                  BBOX: bbox.join(','), WIDTH: width, HEIGHT: height, FORMAT: 'image/png',
                  INFO_FORMAT: 'text/plain', X: x, Y: y, FEATURE_COUNT: 10
                });
                const mostra = q.body.split('\n').join(' ').trim().slice(0, 220);
                if (mostra && mostra !== 'GetFeatureInfo results:') {
                  console.log('[wms-check] feature ' + capa + '/' + nom + ': http=' + q.r.status + ' ' + mostra);
                }
              } catch (error) {
                console.log('[wms-check] feature ' + capa + '/' + nom + ': ERROR ' + String(error?.message || error).slice(0, 120));
              }
            }
          }
          NODE

      - name: Rastrear fuentes
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: npm run rastreo

      - name: Guardar cambios (solo si hay novedades)
        id: guardar
        shell: bash
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "rastreo-bot"
          git config user.email "rastreo-bot@users.noreply.github.com"

          # Primer intento con los datos ya rastreados.
          cambio_guardado=false
          git add docs/data
          if ! git diff --staged --quiet; then
            git commit -m "Rastreo: actualización de datos"
            cambio_guardado=true
          else
            echo "Sin cambios iniciales."
          fi

          # Si main ha avanzado desde el checkout, no hacemos rebase de JSON:
          # recuperamos la última versión y volvemos a rastrear sobre ella.
          # Así evitamos conflictos y no perdemos novedades de otra ejecución.
          for intento in 1 2 3; do
            git fetch origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "main ha avanzado; se vuelve a rastrear sobre la última versión."
              git reset --hard origin/main
              npm run rastreo
              git add docs/data

              if git diff --staged --quiet; then
                echo "La última versión ya contiene todos los datos; no hay nada que guardar."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              git commit -m "Rastreo: actualización de datos"
              cambio_guardado=true
            fi

            if git push origin HEAD:main; then
              echo "Datos guardados correctamente (intento $intento)."
              echo "changed=$cambio_guardado" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rechazado; se sincronizará y repetirá el rastreo (intento $intento/3)."
            sleep 3
          done

          echo "No se pudieron guardar los datos después de 3 intentos."
          exit 1

      # Una ejecución programada solo vuelve a publicar Pages si hay datos nuevos.
      # Los pushes de cambios de código/configuración siempre publican el sitio.
      - name: Configurar GitHub Pages
        if: github.event_name != 'schedule' || steps.guardar.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      # La clau de navegador és pública per disseny, però ha d'estar restringida
      # al domini de Pages i exclusivament a Google Calendar API.
      - name: Preparar configuració pública del calendari
        if: github.event_name != 'schedule' || steps.guardar.outputs.changed == 'true'
        shell: bash
        env:
          GOOGLE_CALENDAR_BROWSER_API_KEY: ${{ secrets.GOOGLE_CALENDAR_BROWSER_API_KEY }}
          GOOGLE_CALENDAR_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_CALENDAR_APPS_SCRIPT_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const apiKey = process.env.GOOGLE_CALENDAR_BROWSER_API_KEY?.trim() || '';
          const proxyUrl = process.env.GOOGLE_CALENDAR_APPS_SCRIPT_URL?.trim() || '';
          if (proxyUrl) {
            const endpoint = new URL(proxyUrl);
            if (endpoint.protocol !== 'https:' || endpoint.hostname !== 'script.google.com'
              || !endpoint.pathname.includes('/macros/s/') || !endpoint.pathname.endsWith('/exec')) {
              throw new Error('GOOGLE_CALENDAR_APPS_SCRIPT_URL ha de ser una URL /exec de script.google.com.');
            }
          }
          await writeFile('docs/calendar-client.json', JSON.stringify({ apiKey, proxyUrl }, null, 2) + '\n', 'utf8');
          console.log(proxyUrl
            ? 'Proxy autenticat del calendari preparat.'
            : 'Proxy autenticat pendent de GOOGLE_CALENDAR_APPS_SCRIPT_URL.');
          NODE

      - name: Preparar archivos del sitio
        if: github.event_name != 'schedule' || steps.guardar.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar en GitHub Pages
        if: github.event_name != 'schedule' || steps.guardar.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
