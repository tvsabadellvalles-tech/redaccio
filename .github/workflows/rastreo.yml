name: Rastreo y publicación

on:
  push:
    branches:
      - main
    # Los commits automáticos de datos no deben volver a disparar el rastreo.
    paths-ignore:
      - 'docs/data/**'
  schedule:
    - cron: '*/5 * * * *' # cada 5 minutos, en UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Impide que dos rastreos/publicaciones trabajen a la vez.
concurrency:
  group: rastreo
  cancel-in-progress: false
  queue: max

jobs:
  rastrear:
    runs-on: windows-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rastrear fuentes
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: npm run rastreo

      - name: Guardar cambios (solo si hay novedades)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rastreo-bot"
          git config user.email "rastreo-bot@users.noreply.github.com"
          git add docs/data

          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "Rastreo: actualización de datos"

          # Integra cualquier commit que haya llegado a main desde el checkout.
          # Reintenta el push si alguien publica justo en ese momento.
          for intento in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Datos guardados correctamente (intento $intento)."
              exit 0
            fi
            echo "Push rechazado; se volverá a sincronizar (intento $intento/3)."
            sleep 2
          done

          echo "No se pudieron guardar los datos después de 3 intentos."
          exit 1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
